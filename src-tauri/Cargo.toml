[package]
name = "whisper-scribe"
version = "0.1.0"
description = "Offline recording and transcription desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whisper_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
# On by default: GPU inference via the ggml Vulkan backend. Declared as our own
# feature, rather than only enabling it on the dependency, so this crate can also
# read `cfg!(feature = "vulkan")` and report the backend it was built for.
#
# Enabling it turns on whisper-rs's internal `_gpu` feature, which is what makes
# `WhisperContextParameters::default()` set `use_gpu: true` — no code change is
# needed to actually use the GPU. Requires the Vulkan SDK at build time
# (`VULKAN_SDK`); at runtime only the vendor driver's vulkan-1.dll is needed.
#
# Build CPU-only with `--no-default-features`, which also drops the Vulkan SDK
# and Ninja requirements described in scripts/win-build-env.bat.
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-opener = "=2.4.0"
tauri-plugin-fs = "=2.4.5"
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16.0"
# `shared`, not the default `static`: the prebuilt static archive is `-MT-`
# (built against the static CRT with VS2022's STL), and this machine's linker
# is VS2019 Build Tools 14.29, whose libcpmt.lib lacks several VS2022 STL
# symbols the archive needs (__std_find_last_trivial_1 and friends -- 41
# unresolved symbols, verified). Static linking would require installing VS2022
# just for this dependency. `shared` closes the runtime inside its own DLLs, so
# it links against whatever toolchain built it and needs nothing from ours.
# Trade-off: sherpa-onnx-c-api.dll + onnxruntime.dll (~22MB) must ship next to
# the exe -- see the `bundle.resources` entries in tauri.conf.json.
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["shared"] }
# WASAPI process-loopback capture for "app audio" (Teams/Zoom/etc).
wasapi = "0.24.0"
# Same major version wasapi itself depends on (kept in sync so Cargo unifies
# them into one copy rather than compiling `windows` twice). Used for
# QueryFullProcessImageNameW (PID -> friendly app name) and, with the extra
# Shell/Gdi features below, pulling each app's own small icon for the same
# picker (SHGetFileInfoW -> HICON -> GetDIBits -> raw BGRA pixels).
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }
# Encodes the extracted icon pixels as PNG; only the encoder half is needed,
# so decoders for every other format are disabled.
image = { version = "0.25", default-features = false, features = ["png"] }
# Turns the encoded PNG bytes into a data: URI the frontend `<img>` can use
# directly, with no extra Tauri command/round-trip just to fetch icons.
base64 = "0.22"
