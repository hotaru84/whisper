[package]
name = "whisper-scribe"
version = "0.1.0"
description = "Offline recording and transcription desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whisper_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-opener = "=2.4.0"
tauri-plugin-fs = "=2.4.5"
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `vulkan` runs inference on the GPU via the ggml Vulkan backend. It also enables
# whisper-rs's internal `_gpu` feature, which is what makes
# `WhisperContextParameters::default()` set `use_gpu: true` — so no code change is
# needed to actually use the GPU. Requires the Vulkan SDK at build time
# (`VULKAN_SDK` env var); at runtime only the vendor driver's vulkan-1.dll is needed.
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
